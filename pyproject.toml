[project]
name = "conferi-ai"
version = "0.1.0"
description = "Conferência e organização de notas fiscais (NF-e e NFC-e) para escritórios de contabilidade"
authors = [{ name = "Marcos Augusto Gomes Cunha", email = "" }]
requires-python = ">=3.11"
readme = "README.md"
dependencies = [
    "PySide6>=6.6",
    "defusedxml>=0.7",
    "platformdirs>=4.0",
    "XlsxWriter>=3.1",
    "openpyxl>=3.1",
    "reportlab>=4.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.4", "pyinstaller>=6.5"]

[project.gui-scripts]
conferi-ai = "conferi.ui.app:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["conferi*"]

[tool.setuptools.package-data]
conferi = ["assets/fonts/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["F", "E9", "B", "I"]
ignore = ["B008", "B905"]
